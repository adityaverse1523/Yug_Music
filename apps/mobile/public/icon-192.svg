<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#302b25" />
      <stop offset="100%" stop-color="#1e1b18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c58a" />
      <stop offset="50%" stop-color="#b58a4b" />
      <stop offset="100%" stop-color="#8c6836" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4 2" opacity="0.6" />
  <circle cx="96" cy="96" r="66" fill="#fbf7ef" />
  
  <!-- Classical Musical Note & Harp Motif -->
  <g transform="translate(96, 96) scale(0.9) translate(-96, -96)">
    <!-- Treble / Classical Beam Note -->
    <path d="M76 112 A14 14 0 1 1 62 98 A14 14 0 0 1 76 112 Z" fill="url(#goldGrad)" />
    <path d="M130 102 A14 14 0 1 1 116 88 A14 14 0 0 1 130 102 Z" fill="url(#goldGrad)" />
    <rect x="73" y="52" width="6" height="60" rx="3" fill="url(#goldGrad)" />
    <rect x="127" y="42" width="6" height="60" rx="3" fill="url(#goldGrad)" />
    <!-- Connecting Beam -->
    <polygon points="73,52 133,42 133,56 73,66" fill="url(#goldGrad)" />
    <!-- Small star accents -->
    <circle cx="96" cy="138" r="3" fill="url(#goldGrad)" />
  </g>
</svg>

